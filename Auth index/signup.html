<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadCraft - Sign Up</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="promo-panel">
            <img src="../image/leftimage.png" alt="ThreadCraft Design Studio Showcase">
        </div>

        <!-- Form Panel -->
        <div class="form-panel">
            <div class="brand">
                <img src="../image/ThreadCraft (Logo).svg" alt="ThreadCraft Logo">
            </div>

            <div class="form-content">
                <h2>Create Account</h2>
                <p class="subtitle">Sign up to start customizing and saving your unique style</p>

                <div id="auth-message" class="auth-message"></div>

                <form id="signupForm">
                    <div class="input-group">
                        <label for="fullname">Full name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <small class="field-error" id="email-error"></small>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <small class="field-error" id="password-error"></small>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                        <small class="field-error" id="confirm-error"></small>
                    </div>

                    <button type="submit" class="login-btn">Create Account</button>
                </form>

                <a href="../index.html" class="back-browse-btn">← Back to browse</a>

                <p class="account-text">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>
    <div id="success-modal" class="success-modal">
        <div class="success-modal-box">
            <div class="success-icon">✓</div>
            <h3>Account Created!</h3> 
            <p>Redirecting you to login...</p>
        </div>
    </div>
</body>
<script src="../script/auth.js"></script>
</html>
